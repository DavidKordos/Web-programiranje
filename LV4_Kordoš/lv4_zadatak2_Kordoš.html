<!DOCTYPE html>
<html lang="hr"><head><meta charset="UTF-8"><title>LV4 - Zadatak 2</title></head>
<body><h1>Zadatak 2 – Funkcije i closure</h1><p>Otvorite konzolu (F12 → Console).</p>
<script>
function ispisiParametar1(parametar) { console.log(parametar); }
const ispisiParametar2 = function (parametar) { console.log(parametar); };
const ispisiParametar3 = (parametar) => { console.log(parametar); };
ispisiParametar1("Prva");
ispisiParametar2("Druga");
ispisiParametar3("Treća");
function vratiIme(ime) {
    const x = ime;
    function f() { return x; }
    return f;
}
const y = vratiIme("Hrvoje Horvat");
console.log("y je funkcija, ne tekst:", y);

const z = vratiIme("Hrvoje Horvat")();
console.log("z:", z);
var ime = "Pero Perić";
(function (x) {
    console.log("Predano ime je " + x);
})(ime);

const vratiImeStrelica = (ime) => () => ime;
console.log("Streličasti closure:", vratiImeStrelica("Hrvoje Horvat")());
</script></body></html>
